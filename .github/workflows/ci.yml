name: Verify storybook

on:
  push:
  pull_request:
  workflow_call:
    inputs:
      base_path:
        type: string
        default: /one-sky-many-stories/
      package_pages:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: 'true'
      VITE_BASE_PATH: ${{ inputs.base_path || '/one-sky-many-stories/' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npx --no-install playwright install --with-deps chromium webkit
      - run: npm test
      - name: Retain browser screenshots and failure traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-evidence
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7
      - name: Package the tested site
        if: ${{ inputs.package_pages && success() }}
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/
